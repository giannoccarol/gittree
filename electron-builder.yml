appId: com.lorenzogit.gittree
productName: GitTree
copyright: Copyright © 2026 Lorenzo

asar: true
asarUnpack:
  - node_modules/node-pty/**/*
compression: maximum
generateUpdatesFilesForAllChannels: true

directories:
  output: dist
  buildResources: build

files:
  - dist/**/*
  - icon.png
  - package.json
  - "!dist/*-unpacked/**"
  - "!dist/*.AppImage*"
  - "!dist/*.pacman"
  - "!dist/*.deb"
  - "!dist/*.exe*"
  - "!dist/*.zip*"
  - "!dist/*.dmg*"
  - "!dist/*.blockmap"
  - "!dist/snap-template*"
  - "!dist/builder-debug.yml"
  - "!dist/builder-effective-config.yaml"
  - "!**/*.map"
  - "!**/*.md"

extraResources:
  - from: build/oauth-config.json
    to: oauth-config.json

protocols:
  - name: GitTree
    schemes:
      - gittree

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

afterPack: scripts/electron-after-pack.mjs

publish:
  provider: github
  owner: giannoccarol
  repo: gittree
  releaseType: release

win:
  icon: icon.png
  executableName: GitTree
  target:
    - target: nsis

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GitTree
  uninstallDisplayName: GitTree
  deleteAppDataOnUninstall: false
  include: installer.nsh

mac:
  icon: icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip

dmg:
  title: GitTree ${version}

linux:
  icon: icons
  category: Development
  executableName: gittree
  synopsis: Fast visual Git desktop client
  description: A fast, visual and privacy-first Git desktop client.
  target:
    - AppImage
    - deb
    - pacman

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2

pacman:
  packageName: gittree-bin
  depends:
    - gtk3
    - libnotify
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - util-linux-libs
    - libsecret
    - alsa-lib

appImage:
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
