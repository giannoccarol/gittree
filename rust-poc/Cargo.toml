[workspace]
resolver = "2"
members = [
    "crates/gittree-core",
    "crates/gittree-sidecar",
    "crates/gittree-gpui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
