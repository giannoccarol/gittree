name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality, Electron and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality gates
        run: npm run quality:full
        env:
          NODE_V8_COVERAGE: coverage
      - name: Build application for E2E
        run: npm run build:compile && node scripts/prepare-build-assets.js --renderer-only
      - name: Run Electron E2E
        run: xvfb-run -a npm run test:e2e
      - name: Prepare application assets
        run: npm run prepare:assets
      - name: Verify Linux package
        run: npx electron-builder --linux --dir --publish never
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: coverage
          if-no-files-found: ignore
      - name: Upload failed Electron diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-failure-linux
          path: test-results
          if-no-files-found: ignore

  windows:
    name: Windows tests, Electron and package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and integration tests
        run: npm test
      - name: Run contract tests
        run: npm run test:contracts
      - name: Build application for E2E
        run: npm run build:compile && node scripts/prepare-build-assets.js --renderer-only
      - name: Run Electron E2E
        run: npm run test:e2e
      - name: Prepare application assets
        run: npm run prepare:assets
      - name: Verify unsigned Windows package
        run: npx electron-builder --win --dir --publish never
      - name: Upload failed Electron diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-failure-windows
          path: test-results
          if-no-files-found: ignore

  macos:
    name: macOS scheduled and release verification
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit and integration tests
        run: npm test
      - name: Build application for E2E
        run: npm run build:compile && node scripts/prepare-build-assets.js --renderer-only
      - name: Run Electron E2E
        run: npm run test:e2e
      - name: Prepare application assets
        run: npm run prepare:assets
      - name: Verify macOS package
        run: npx electron-builder --mac --dir --publish never
      - name: Upload failed Electron diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-failure-macos
          path: test-results
          if-no-files-found: ignore
