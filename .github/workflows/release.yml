name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  GITTREE_GITHUB_CLIENT_ID: ${{ vars.GITTREE_GITHUB_CLIENT_ID }}
  GITTREE_GITLAB_CLIENT_ID: ${{ vars.GITTREE_GITLAB_CLIENT_ID }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run test:contracts
      - run: npm run audit:design
      - run: npm run lint

  prepare-release:
    name: Create atomic draft
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Create or reuse draft release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $tag is already published and cannot be overwritten." >&2
              exit 1
            fi
            gh release edit "$tag" --draft --title "GitTree $tag"
            while IFS= read -r asset; do
              if [[ -n "$asset" ]]; then
                gh release delete-asset "$tag" "$asset" --yes
              fi
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          else
            gh release create "$tag" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "GitTree $tag"
          fi

  windows:
    name: Windows x64
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:compile
      - run: npm run prepare:assets
      - run: npx electron-builder --win --x64 --publish never
      - name: Validate and upload Windows OTA assets
        run: node scripts/release-assets.js --platform win --directory dist --tag "$env:GITHUB_REF_NAME"

  macos:
    name: macOS x64 and arm64 artifacts
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_OTA_ENABLED: ${{ secrets.MACOS_CSC_LINK != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:compile
      - run: npm run prepare:assets
      - name: Build macOS installers
        shell: bash
        run: |
          set -euo pipefail
          builder_args=()
          if [[ "$MACOS_OTA_ENABLED" == "true" ]]; then
            unset CSC_IDENTITY_AUTO_DISCOVERY
          else
            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            builder_args=(-c.mac.identity=null -c.mac.hardenedRuntime=false)
          fi
          npx electron-builder --mac --x64 --arm64 --publish never "${builder_args[@]}"
      - name: Validate and upload macOS OTA assets
        shell: bash
        run: |
          set -euo pipefail
          platform="mac-manual"
          if [[ "$MACOS_OTA_ENABLED" == "true" ]]; then
            platform="mac"
          fi
          node scripts/release-assets.js \
            --platform "$platform" \
            --directory dist \
            --tag "$GITHUB_REF_NAME"

  linux:
    name: Linux x64
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:compile
      - run: npm run prepare:assets
      - name: Install Pacman packaging tools
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools
      - run: npx electron-builder --linux --x64 --publish never
      - name: Validate Linux runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -maxdepth 1 -type f -name 'GitTree-*-linux-*.deb' -print -quit)"
          if [[ -z "$deb" ]]; then
            echo "Linux DEB artifact was not generated." >&2
            exit 1
          fi
          pacman_package="$(find dist -maxdepth 1 -type f -name 'GitTree-*-linux-*.pacman' -print -quit)"
          if [[ -z "$pacman_package" ]]; then
            echo "Linux Pacman artifact was not generated." >&2
            exit 1
          fi
          dpkg-deb --field "$deb" Depends \
            | tr ',' '\n' \
            | grep -Eq '^[[:space:]]*libasound2([[:space:](]|$)'
      - name: Validate and upload Linux OTA assets
        run: node scripts/release-assets.js --platform linux --directory dist --tag "$GITHUB_REF_NAME"

  publish:
    name: Publish complete release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Publish stable release or prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false --latest
          fi
