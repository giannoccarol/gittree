<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self' data:; img-src 'self' data:">
  <title>Inspector</title>
  <link rel="stylesheet" href="../../node_modules/@phosphor-icons/web/src/regular/style.css">
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/variables.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/diff-viewer.css">
  <link rel="stylesheet" href="styles/inspector-workspace.css">
  <link rel="stylesheet" href="styles/inspector-window.css">
</head>
<body>
  <div class="inspector-window-shell">
    <header class="inspector-window-header">
      <div class="inspector-window-title">
        <span id="inspector-eyebrow" class="eyebrow">Inspector</span>
        <h1 id="inspector-title">Commit details</h1>
        <p id="inspector-meta" class="inspector-window-meta is-hidden"></p>
      </div>
      <div id="inspector-diff-controls" class="inspector-window-controls">
        <div class="segmented-control" role="group" aria-label="Diff layout" data-i18n-aria-label="details.diffLayout">
          <button id="inspector-mode-unified" class="btn btn-small active" type="button" aria-pressed="true" data-i18n="details.unified">Unified</button>
          <button id="inspector-mode-split" class="btn btn-small" type="button" aria-pressed="false" data-i18n="details.split">Split</button>
        </div>
        <button id="inspector-word" class="btn btn-small" type="button" aria-pressed="true" title="Word-level changes" data-i18n-title="details.wordDiff">
          <i class="ph ph-text-t" aria-hidden="true"></i>
          <span data-i18n="details.wordDiffShort">Words</span>
        </button>
      </div>
    </header>
    <main id="inspector-workspace" class="inspector-workspace inspector-workspace-popout">
      <div class="inspector-diff-pane">
        <div id="inspector-body" class="detail-panel-body">
          <div class="diff-placeholder">
            <i class="ph ph-circle-notch"></i>
            <span data-i18n="common.loading">Loading…</span>
          </div>
        </div>
      </div>
      <aside id="inspector-files-panel" class="inspector-files-panel" aria-label="Changed files" data-i18n-aria-label="details.fileListTitle">
        <header class="inspector-side-header">
          <div class="inspector-side-heading">
            <strong data-i18n="details.fileListTitle">Changed files</strong>
            <small data-inspector-file-count>0 files</small>
          </div>
          <button id="btn-toggle-inspector-files" class="btn-icon" type="button" aria-controls="inspector-file-list" aria-expanded="true" title="Hide changed files" data-i18n-title="details.filesClose">
            <i class="ph ph-caret-right" aria-hidden="true"></i>
          </button>
        </header>
        <div id="inspector-file-list" class="inspector-file-list" role="listbox"></div>
      </aside>
    </main>
  </div>
  <script src="../../node_modules/i18next/dist/umd/i18next.min.js"></script>
  <script src="i18n.js"></script>
  <script type="module" src="inspector-window.mjs"></script>
</body>
</html>
